<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新建预约</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="machine-shell">
<header class="machine-header"><a class="machine-brand" href="/stack">自动预约机<small>PKU VISITOR APPOINTMENT</small></a><nav class="machine-nav"><a class="active" href="/appointment">新建预约</a><a href="/history">历史记录</a><a href="/stack">任务队列</a><a href="/topt">动态验证码</a></nav></header>
<section class="page-hero"><div><p class="section-kicker">Appointment</p><h1>创建预约申请</h1><p>保存后会成为学校系统中的草稿；定时任务请到队列中从历史记录选择。</p></div></section>
<section class="card machine-card"><div class="student-info" id="studentInfo"></div><p class="appointment-hint" id="appointmentHint">正在读取学校预约配置…</p>
<form id="appointmentForm" autocomplete="off"><div class="form-grid"><label>预约人联系电话<input id="lxdh" required></label><label>预约日期<select id="yyrq" required><option>正在读取…</option></select></label><label>预约时间<select id="yysj" required><option>正在读取…</option></select></label><label>预约校门<select id="yyxm" required><option>正在读取…</option></select></label><label>被预约人姓名<input id="byyrxm" maxlength="30" required></label><label>被预约人证件号<input id="byyrzjh" placeholder="6—18 位字母或数字" required></label><label>被预约人联系电话<input id="byyrlxdh" placeholder="11 位手机号" required></label></div>
<div class="appointment-tools"><button class="button button-quiet" id="recentContactsButton" type="button">选择近期预约人</button><button class="button button-quiet" id="toggleAutoPickButton" type="button">从文本提取信息</button></div><textarea id="autoPick" rows="2" hidden placeholder="粘贴：姓名 证件号 手机号"></textarea><label>预约事由<textarea id="yysy" maxlength="100" rows="4" required></textarea></label>
<div class="form-actions"><button class="button button-secondary" id="saveDraftButton" type="submit">保存为草稿</button><button class="button button-primary" id="submitNowButton" type="button">保存并立即提交</button></div><p class="form-message" id="appointmentMessage"></p></form>
<div class="recent-contacts" id="recentContacts" hidden><div class="recent-head"><strong>近期预约人</strong><button class="button button-quiet" id="closeRecentContacts" type="button">关闭</button></div><div id="recentContactList"></div></div></section>
</main><script src="/static/common.js"></script><script src="/static/appointment.js"></script></body></html>
