<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务队列</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="machine-shell">
<header class="machine-header"><a class="machine-brand" href="/stack">自动预约机<small>PKU VISITOR APPOINTMENT</small></a><nav class="machine-nav"><a href="/appointment">新建预约</a><a href="/history">历史记录</a><a class="active" href="/stack">任务队列</a><a href="/topt">动态验证码</a></nav></header>
<section class="page-hero"><div><p class="section-kicker">Stack</p><h1>自动提交队列</h1><p>从学校历史记录选择尚未提交的草稿，并安排北京时间；页面关闭后后台仍继续运行。</p></div></section><div class="config-warning" id="configWarning" hidden></div><section class="status-grid" id="statusGrid"></section>
<section class="card machine-card"><div class="records-head"><div><p class="section-kicker">From history</p><h2>选择已创建的预约</h2></div><button class="button button-quiet" id="refreshCandidates">刷新历史记录</button></div><div class="history-picker-grid"><label>预约草稿<select id="historyCandidate"><option value="">正在读取…</option></select></label><label>自动提交时间（北京时间）<input id="candidateScheduledAt" type="datetime-local" step="1"></label><label>最多尝试次数<select id="candidateMaxAttempts"><option value="1">1 次</option><option value="3" selected>3 次</option><option value="5">5 次</option></select></label><button class="button button-secondary" id="addFromHistory">加入提交队列</button></div><p class="form-message" id="candidateMessage"></p></section>
<section class="card machine-card"><div id="stackList"><div class="machine-empty">正在读取任务队列…</div></div><p class="form-message" id="stackMessage"></p></section>
</main><script src="/static/common.js"></script><script src="/static/stack.js"></script></body></html>
